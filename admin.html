<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الردود — مصطفى وسها</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:ital@1&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
    :root {
        --cream: #fffaf2;
        --cream-2: #fdf6ea;
        --gold: #c9ad7a;
        --gold-dark: #866739;
        --brown: #4a3624;
        --brown-light: #a3844f;
        --border: #e3cda3;
        --green: #4d7a4d;
        --red: #a34c3f;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #f9efdd 0%, #f3e5c9 100%);
        font-family: 'EB Garamond', serif;
        color: var(--brown);
        padding: 40px 16px 60px;
    }

    .wrap { max-width: 980px; margin: 0 auto; }

    .header {
        text-align: center;
        margin-bottom: 34px;
    }
    .header .eyebrow-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 14px;
    }
    .header .eyebrow-row .line { width: 50px; height: 1px; background: var(--gold); }
    .header .eyebrow-row .word {
        letter-spacing: 3px;
        font-size: 14px;
        color: var(--brown-light);
    }
    .header h1 {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: 2px;
        margin: 0 0 6px;
        color: var(--brown);
    }
    .header .sub {
        font-family: 'Amiri', serif;
        font-size: 17px;
        color: var(--brown-light);
    }

    /* Key gate */
    .gate {
        max-width: 420px;
        margin: 60px auto;
        background: var(--cream);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 36px 30px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(74,59,40,0.14);
    }
    .gate h2 {
        font-family: 'Amiri', serif;
        font-size: 24px;
        margin: 0 0 20px;
        color: var(--brown);
    }
    .gate input {
        width: 100%;
        font-family: 'EB Garamond', serif;
        font-size: 16px;
        padding: 12px 14px;
        border: 1px solid #d9bf8f;
        border-radius: 8px;
        background: var(--cream-2);
        color: var(--brown);
        outline: none;
        margin-bottom: 16px;
        text-align: center;
    }
    .gate input:focus { border-color: var(--gold-dark); }
    .gate button, .toolbar button, .export-btn {
        font-family: 'Amiri', serif;
        font-weight: 700;
        font-size: 16px;
        color: var(--cream);
        background: var(--gold-dark);
        border: none;
        border-radius: 8px;
        padding: 12px 22px;
        cursor: pointer;
        transition: background .2s ease, opacity .2s ease;
    }
    .gate button:hover, .toolbar button:hover, .export-btn:hover { background: #6b5027; }
    .gate .error { color: var(--red); font-size: 14px; margin-top: 12px; min-height: 18px; }

    /* Stats */
    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 30px;
    }
    .stat-card {
        background: var(--cream);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px 14px;
        text-align: center;
        box-shadow: 0 10px 24px rgba(74,59,40,0.10);
    }
    .stat-card .num {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        font-size: 34px;
        color: var(--gold-dark);
        display: block;
        line-height: 1.1;
    }
    .stat-card .label {
        font-family: 'Amiri', serif;
        font-size: 14px;
        color: var(--brown-light);
        margin-top: 6px;
        display: block;
    }

    /* Toolbar */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }
    .toolbar .search {
        flex: 1;
        min-width: 200px;
        font-family: 'EB Garamond', serif;
        font-size: 15px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--cream);
        color: var(--brown);
        outline: none;
    }
    .toolbar .search:focus { border-color: var(--gold-dark); }
    .toolbar-actions { display: flex; gap: 10px; }
    .filter-select {
        font-family: 'EB Garamond', serif;
        font-size: 15px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--cream);
        color: var(--brown);
        outline: none;
        cursor: pointer;
    }

    /* Table card */
    .table-card {
        background: var(--cream);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(74,59,40,0.14);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
        font-family: 'Amiri', serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: var(--cream);
        background: var(--gold-dark);
        padding: 16px 14px;
        text-align: right;
        white-space: nowrap;
    }
    thead th:first-child { border-top-right-radius: 0; }
    tbody td {
        font-family: 'Amiri', serif;
        font-size: 15.5px;
        color: var(--brown);
        padding: 14px;
        border-bottom: 1px dashed var(--border);
        text-align: right;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: rgba(201,173,122,0.06); }
    tbody tr:hover { background: rgba(201,173,122,0.14); }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 700;
        font-family: 'Amiri', serif;
    }
    .badge.yes { background: rgba(77,122,77,0.14); color: var(--green); }
    .badge.no { background: rgba(163,76,63,0.14); color: var(--red); }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .empty-state, .loading-state, .error-state {
        text-align: center;
        padding: 60px 20px;
        font-family: 'Amiri', serif;
        color: var(--brown-light);
        font-size: 17px;
    }
    .error-state { color: var(--red); }

    .footer-actions {
        display: flex;
        justify-content: center;
        margin-top: 26px;
    }

    @media screen and (max-width: 720px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
        thead { display: none; }
        table, tbody, tr, td { display: block; width: 100%; }
        tbody tr {
            background: var(--cream);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 14px;
            padding: 6px 4px;
        }
        tbody tr:nth-child(even) { background: var(--cream); }
        tbody td {
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        tbody td:last-child { border-bottom: none; }
        tbody td::before {
            content: attr(data-label);
            font-family: 'EB Garamond', serif;
            font-style: italic;
            color: var(--brown-light);
            font-size: 13px;
            margin-left: 10px;
        }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="eyebrow-row">
            <span class="line"></span>
            <span class="word">تأكيد الحضور</span>
            <span class="line"></span>
        </div>
        <h1>مصطفى &amp; سها</h1>
        <div class="sub">قائمة ردود الضيوف</div>
    </div>

    <div id="gate" class="gate">
        <h2>الدخول إلى لوحة الردود</h2>
        <input type="password" id="key-input" placeholder="أدخل كلمة السر" autocomplete="off">
        <button id="key-submit">دخول</button>
        <div class="error" id="gate-error"></div>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="stats" id="stats"></div>

        <div class="toolbar">
            <input type="text" class="search" id="search-input" placeholder="بحث بالاسم...">
            <div class="toolbar-actions">
                <select class="filter-select" id="filter-select">
                    <option value="all">الكل</option>
                    <option value="yes">الحاضرون فقط</option>
                    <option value="no">غير الحاضرين فقط</option>
                </select>
                <button id="export-btn" class="export-btn">تصدير Excel (CSV)</button>
            </div>
        </div>

        <div class="table-card">
            <table id="rsvp-table">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>عدد الأشخاص</th>
                        <th>الحضور</th>
                        <th>تاريخ الرد</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display:none;">لا توجد ردود مطابقة.</div>
        </div>
    </div>
</div>

<script>
(function() {
    var allData = [];
    var adminKey = '';

    var gate = document.getElementById('gate');
    var dashboard = document.getElementById('dashboard');
    var keyInput = document.getElementById('key-input');
    var keySubmit = document.getElementById('key-submit');
    var gateError = document.getElementById('gate-error');
    var searchInput = document.getElementById('search-input');
    var filterSelect = document.getElementById('filter-select');
    var exportBtn = document.getElementById('export-btn');
    var tableBody = document.getElementById('table-body');
    var emptyState = document.getElementById('empty-state');
    var statsEl = document.getElementById('stats');

    // Allow passing ?key=... in the URL for convenience.
    var urlParams = new URLSearchParams(window.location.search);
    var urlKey = urlParams.get('key');
    if (urlKey) {
        keyInput.value = urlKey;
        fetchData(urlKey);
    }

    keySubmit.addEventListener('click', function() {
        var val = keyInput.value.trim();
        if (!val) return;
        fetchData(val);
    });
    keyInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') keySubmit.click();
    });

    function fetchData(key) {
        gateError.textContent = '';
        keySubmit.disabled = true;
        keySubmit.textContent = 'جاري التحقق...';

        fetch('/api/rsvp', { headers: { 'x-admin-key': key } })
            .then(function(res) {
                if (res.status === 401) throw new Error('unauthorized');
                if (!res.ok) throw new Error('network');
                return res.json();
            })
            .then(function(json) {
                adminKey = key;
                allData = json.data || [];
                gate.style.display = 'none';
                dashboard.style.display = 'block';
                renderStats();
                renderTable();
            })
            .catch(function(err) {
                keySubmit.disabled = false;
                keySubmit.textContent = 'دخول';
                gateError.textContent = err.message === 'unauthorized'
                    ? 'كلمة السر غير صحيحة.'
                    : 'حدث خطأ، برجاء المحاولة مرة أخرى.';
            });
    }

    function renderStats() {
        var confirmed = allData.filter(function(r) { return r.attending === 'yes'; });
        var declined = allData.filter(function(r) { return r.attending === 'no'; });
        var totalGuests = confirmed.reduce(function(sum, r) { return sum + (parseInt(r.count, 10) || 0); }, 0);

        statsEl.innerHTML = [
            statCard(allData.length, 'إجمالي الردود'),
            statCard(confirmed.length, 'مؤكدون بالحضور'),
            statCard(declined.length, 'اعتذروا'),
            statCard(totalGuests, 'إجمالي عدد الحضور')
        ].join('');
    }

    function statCard(num, label) {
        return '<div class="stat-card"><span class="num">' + num + '</span><span class="label">' + label + '</span></div>';
    }

    function formatDate(iso) {
        try {
            var d = new Date(iso);
            return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' }) +
                   ' — ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
            return '';
        }
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    function getFiltered() {
        var q = searchInput.value.trim().toLowerCase();
        var filter = filterSelect.value;
        return allData.filter(function(r) {
            var matchesSearch = !q || (r.name || '').toLowerCase().indexOf(q) !== -1;
            var matchesFilter = filter === 'all' || r.attending === filter;
            return matchesSearch && matchesFilter;
        });
    }

    function renderTable() {
        var rows = getFiltered();
        if (!rows.length) {
            tableBody.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        tableBody.innerHTML = rows.map(function(r) {
            var badge = r.attending === 'yes'
                ? '<span class="badge yes"><span class="dot"></span> حاضر</span>'
                : '<span class="badge no"><span class="dot"></span> معتذر</span>';
            return '<tr>' +
                '<td data-label="الاسم">' + escapeHtml(r.name) + '</td>' +
                '<td data-label="عدد الأشخاص">' + escapeHtml(r.count) + '</td>' +
                '<td data-label="الحضور">' + badge + '</td>' +
                '<td data-label="تاريخ الرد">' + escapeHtml(formatDate(r.createdAt)) + '</td>' +
                '</tr>';
        }).join('');
    }

    searchInput.addEventListener('input', renderTable);
    filterSelect.addEventListener('change', renderTable);

    exportBtn.addEventListener('click', function() {
        var rows = getFiltered();
        var header = ['الاسم', 'عدد الأشخاص', 'الحضور', 'تاريخ الرد'];
        var lines = [header.join(',')];
        rows.forEach(function(r) {
            var attending = r.attending === 'yes' ? 'حاضر' : 'معتذر';
            var line = [r.name, r.count, attending, formatDate(r.createdAt)]
                .map(function(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; })
                .join(',');
            lines.push(line);
        });
        var csv = '\uFEFF' + lines.join('\r\n'); // BOM for correct Arabic display in Excel
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'rsvp-list.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
})();
</script>
</body>
</html>
